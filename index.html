<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>🎓 Student Management System</h1>
    <p>CRUD-Based Web Application — React-free Vanilla JS + Django REST API</p>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2 id="form-title">Add New Student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id">

        <div class="form-row">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="e.g. Arun Kumar">
          <span class="error" id="err-name"></span>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="e.g. arun@example.com">
          <span class="error" id="err-email"></span>
        </div>

        <div class="form-row">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" required placeholder="10-digit number">
          <span class="error" id="err-phone"></span>
        </div>

        <div class="form-row">
          <label for="course">Course</label>
          <input type="text" id="course" required placeholder="e.g. B.Tech CSE">
          <span class="error" id="err-course"></span>
        </div>

        <div class="form-row">
          <label for="year">Year</label>
          <select id="year" required>
            <option value="">Select Year</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <span class="error" id="err-year"></span>
        </div>

        <div class="form-row">
          <label for="marks">Marks (%)</label>
          <input type="number" id="marks" min="0" max="100" step="0.1" required placeholder="0-100">
          <span class="error" id="err-marks"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display:none;">Cancel</button>
        </div>
        <p id="form-message" class="message"></p>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Student Records</h2>
        <input type="search" id="search-box" placeholder="Search by name, email, course...">
      </div>
      <div id="status-message" class="status"></div>
      <div class="table-wrap">
        <table id="student-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Course</th>
              <th>Year</th>
              <th>Marks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Mini Web Application Activity — VSB Skill Vault | CRUD Web App Demo</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
